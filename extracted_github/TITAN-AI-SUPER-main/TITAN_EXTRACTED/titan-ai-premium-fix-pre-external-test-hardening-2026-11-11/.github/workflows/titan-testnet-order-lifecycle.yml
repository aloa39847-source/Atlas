name: TITAN Spot Execution Lifecycle Regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-spot-execution-regression
  cancel-in-progress: false

jobs:
  titan-spot-execution-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TITAN backend test dependencies
        working-directory: titan_project/titan-ai-premium-78d9310021b58c510c8362e2acb34eba6353eebc/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Exercise TITAN supervised execution path
        run: python .github/scripts/titan_testnet_order_lifecycle.py
      - name: State external-test boundary
        if: always()
        run: |
          echo "This workflow exercises TITAN's actual execution service with a deterministic fake adapter."
          echo "It sends no Binance request and places no order."
          echo "Real Spot Testnet order validation remains a separate, explicitly gated external stage."
