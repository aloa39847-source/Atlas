name: TITAN Frontend Build CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'titan_project/titan-ai-premium-78d9310021b58c510c8362e2acb34eba6353eebc/frontend/**'
      - 'titan_project/titan-ai-premium-78d9310021b58c510c8362e2acb34eba6353eebc/backend/app/**'
      - 'titan_project/titan-ai-premium-78d9310021b58c510c8362e2acb34eba6353eebc/backend/tests/**'
      - '.github/workflows/titan-frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'titan_project/titan-ai-premium-78d9310021b58c510c8362e2acb34eba6353eebc/frontend/**'
      - '.github/workflows/titan-frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: titan_project/titan-ai-premium-78d9310021b58c510c8362e2acb34eba6353eebc/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: titan_project/titan-ai-premium-78d9310021b58c510c8362e2acb34eba6353eebc/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:api
      - run: npm run build
      - run: npm run test:runtime
