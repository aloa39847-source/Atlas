name: TITAN Risk Caps and Testnet Guard — Read Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r titan_project/titan-ai-premium-78d9310021b58c510c8362e2acb34eba6353eebc/backend/requirements.txt
      - name: Compile and test current backend source
        working-directory: titan_project/titan-ai-premium-78d9310021b58c510c8362e2acb34eba6353eebc/backend
        env:
          TITAN_LIVE_TRADING_ENABLED: "false"
          TITAN_BINANCE_PUBLIC_DATA_ENABLED: "false"
        run: |
          python -m compileall -q app tests
          python -m pytest -q tests --disable-warnings
