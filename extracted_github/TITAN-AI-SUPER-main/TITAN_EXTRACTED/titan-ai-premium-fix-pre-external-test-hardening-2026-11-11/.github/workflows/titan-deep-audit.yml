name: TITAN Deep Internal Audit

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published TITAN release tag (blank selects the matching latest release)
        required: false
        type: string
  workflow_run:
    workflows: ["Package one verified TITAN SUPER AI PREMIUM ZIP"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  audit-published-release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_APP_SHA: ${{ github.event.workflow_run.head_sha }}
      REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
      TITAN_LIVE_TRADING_ENABLED: 'false'
      TITAN_BINANCE_PUBLIC_DATA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve exact published release and download its sole ZIP
        id: release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" > releases.json
          python - <<'PY'
          import json, os
          releases=json.load(open('releases.json',encoding='utf-8'))
          requested=os.getenv('REQUESTED_RELEASE_TAG','').strip()
          expected=os.getenv('EXPECTED_APP_SHA','')
          found=[]
          for r in releases:
              if r.get('draft') or r.get('prerelease'): continue
              if requested and r.get('tag_name') != requested: continue
              if expected and not r.get('tag_name','').endswith('-'+expected[:7]): continue
              z=[a for a in r.get('assets',[]) if a.get('name','').lower().endswith('.zip')]
              if len(z)==1: found.append((r,z[0]))
          if not found: raise SystemExit('No published release with exactly one ZIP matched the requested selector')
          if (requested or expected) and len(found)!=1:
              raise SystemExit('Expected one exact matching release with one ZIP; found '+str(len(found)))
          # The GitHub releases API returns newest releases first. With no selector,
          # audit only the newest valid release as promised by the manual workflow input.
          r,a=found[0]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('tag='+r['tag_name']+'\n')
          print('Release:',r['tag_name'],'asset:',a['name'],'bytes:',a['size'],'digest:',a.get('digest'))
          PY
          mkdir -p "$RUNNER_TEMP/titan-release"
          gh release download "${{ steps.release.outputs.tag }}" --pattern '*.zip' --dir "$RUNNER_TEMP/titan-release"
          mapfile -t zips < <(find "$RUNNER_TEMP/titan-release" -maxdepth 1 -type f -name '*.zip')
          test "${#zips[@]}" -eq 1
          sha256sum "${zips[0]}" | tee "$RUNNER_TEMP/release-sha256.txt"
          echo "archive=${zips[0]}" >> "$GITHUB_OUTPUT"
      - name: Validate archive and safely extract the published ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.release.outputs.archive }}" "$RUNNER_TEMP/titan-audit" <<'PY'
          import sys,zipfile
          from pathlib import PurePosixPath
          archive,dest=sys.argv[1:]
          with zipfile.ZipFile(archive) as z:
              if z.testzip(): raise SystemExit('ZIP CRC failure')
              names=z.namelist(); roots={n.split('/',1)[0] for n in names if n}
              if len(roots)!=1: raise SystemExit('Archive must contain exactly one project root')
              for n in names:
                  p=PurePosixPath(n); low=n.lower()
                  if p.is_absolute() or '..' in p.parts or '\\' in n: raise SystemExit('Unsafe path: '+n)
                  runtime_data = len(p.parts) >= 3 and p.parts[1:3] == ('backend', 'data')
                  credential_artifact = (
                      any(token in p.name.lower() for token in ('creds', 'credential', 'secret', 'api_key', 'api_secret', 'private_key'))
                      and p.suffix.lower() not in {'.py', '.md', '.rst'}
                  )
                  env_file = p.name.lower().startswith('.env') and p.name.lower() not in {'.env.example', '.env.sample', '.env.template'}
                  if (runtime_data or credential_artifact
                          or low.endswith(('.db','.sqlite','.sqlite3','.pem','.p12','.pfx','.key','.keystore'))
                          or env_file or '/.git/' in low):
                      raise SystemExit('Forbidden artifact: '+n)
                  try:
                      raw = z.read(n)
                      if b"-----BEGIN " in raw and b"PRIVATE KEY-----" in raw:
                          raise SystemExit('Private-key material detected: '+n)
                      if b"\x00" in raw[:4096]:
                          continue
                      content = raw.decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  import re
                  pattern = re.compile(
                      r"""(?im)^[ \t]*(?:export[ \t]+)?(?:BINANCE_API_KEY|BINANCE_API_SECRET|BINANCE_TESTNET_API_KEY|BINANCE_TESTNET_API_SECRET|AI_API_KEY|TELEGRAM_BOT_TOKEN|TOKENOMIST_API_KEY|XOOMAR_API_KEY|TITAN_SECRET_KEY)[ \t]*[:=][ \t]*['"]?([^\r\n'"]{16,})['"]?[ \t]*(?:#.*)?$"""
                  )
                  placeholders = ("replace", "your_", "example", "placeholder", "change_me", "changeme", "dev-only")
                  for match in pattern.finditer(content):
                      value = match.group(1).strip()
                      if value and not any(marker in value.lower() for marker in placeholders):
                          raise SystemExit('Credential-like assignment detected: '+n)
              z.extractall(dest)
              print('ZIP CRC PASS; entries:',len(names),'root:',next(iter(roots)))
          PY
      - name: Install backend dependencies and test extracted backend
        id: backend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t roots < <(find "$RUNNER_TEMP/titan-audit" -type f -path '*/backend/app/services/core_service.py' -printf '%h\n' | sed 's#/app/services##')
          test "${#roots[@]}" -eq 1
          test -f "${roots[0]}/requirements.txt"
          echo "root=${roots[0]}" >> "$GITHUB_OUTPUT"
          python -m pip install --upgrade pip
          python -m pip install -r "${roots[0]}/requirements.txt" pytest pytest-cov
      - name: Compile and run published backend tests offline
        working-directory: ${{ steps.backend.outputs.root }}
        env:
          TITAN_LIVE_TRADING_ENABLED: 'false'
          TITAN_BINANCE_PUBLIC_DATA_ENABLED: 'false'
        run: |
          set -euo pipefail
          python -m compileall -q app tests
          python -m pytest -q tests --disable-warnings | tee "$RUNNER_TEMP/published-backend-tests.txt"
      - name: Build frontend from the same published archive
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND="$(find "$RUNNER_TEMP/titan-audit" -type f -path '*/frontend/package.json' -printf '%h\n' | head -1)"
          test -n "$FRONTEND"
          cd "$FRONTEND"
          npm ci
          npm run build
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-published-release-deep-audit
          path: |
            ${{ runner.temp }}/release-sha256.txt
            ${{ runner.temp }}/published-backend-tests.txt
          if-no-files-found: ignore
          retention-days: 14
