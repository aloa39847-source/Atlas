name: Extract TITAN project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project safely
        shell: bash
        run: |
          python - <<'PY'
          import os, shutil, zipfile
          from pathlib import Path

          archive = Path("8ptblr.zip")
          if not archive.is_file():
              raise SystemExit("8ptblr.zip was not found in the repository root.")

          temp = Path("/tmp/titan_zip_extract")
          shutil.rmtree(temp, ignore_errors=True)
          temp.mkdir(parents=True)

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              root = temp.resolve()
              for info in z.infolist():
                  target = (temp / info.filename).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
              z.extractall(temp)

          candidates = [p for p in temp.iterdir() if p.is_dir()]
          source = temp
          if len(candidates) == 1:
              source = candidates[0]

          excluded_dirs = {".git", "node_modules", "__pycache__", ".venv", "venv", ".next", "dist", "build", ".pytest_cache"}
          excluded_files = {"8ptblr.zip"}
          for item in source.iterdir():
              if item.name in excluded_dirs or item.name in excluded_files or item.name == ".github":
                  continue
              if item.name.startswith(".env") and item.name != ".env.example":
                  continue
              dest = Path.cwd() / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, dirs_exist_ok=True,
                      ignore=shutil.ignore_patterns(".git", "node_modules", "__pycache__", ".venv", "venv", ".pytest_cache", "*.pyc", "*.db", "*.sqlite", "*.sqlite3"))
              else:
                  if item.suffix.lower() in {".db", ".sqlite", ".sqlite3"}:
                      continue
                  shutil.copy2(item, dest)

          print("Extraction completed. Top-level files:")
          for p in sorted(Path.cwd().iterdir()):
              if p.name not in {".git", ".github"}:
                  print(p.name)
          PY

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract TITAN project from uploaded ZIP"
            git push
          fi
